name: uptime
on:
  schedule:
    - cron: '17 * * * *'  # 每小时第 17 分（避开整点 GitHub cron 拥挤高峰，实测整点可延迟 30min+）
  workflow_dispatch: {}

permissions:
  contents: write   # 月度心跳提交（heartbeat 分支，保 scheduled workflow 不被 60 天不活跃禁用）
  issues: write     # 失败时自动开 Issue

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 健康检查（等待 60s 覆盖免费层冷启动唤醒）
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://og-forge.xyz/v1/health || echo 000)
          echo "health_status=$CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::og-forge.xyz 健康检查失败 (HTTP $CODE)"
            exit 1
          fi

      - name: 失败时开 Issue（@mention 保证邮件必达）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Uptime check FAILED — og-forge.xyz';
            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'uptime'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body: [
                  '@Ray68597 健康检查失败时间(UTC): ' + new Date().toISOString(),
                  '',
                  '**排查步骤**:',
                  '1. 访问 https://og-forge.xyz/v1/health 手动确认',
                  '2. Render 控制台查看服务日志: https://dashboard.render.com',
                  '3. 恢复后关闭本 Issue，下小时巡检自动继续',
                  '',
                  '_(本 Issue 由 uptime workflow 自动创建，已存在未关闭的同类 Issue 时不重复开)_'
                ].join('\n'),
                labels: ['uptime', 'automated']
              });
            }

      - name: Checkout（仅为心跳步骤提供 git）
        if: success() && github.event_name == 'schedule'
        uses: actions/checkout@v4
      - name: 月度心跳（每月 1 号提交到 heartbeat 分支；备份去重后保仓库活跃，防 60 天不活跃禁用 scheduled workflow）
        if: success() && github.event_name == 'schedule'
        run: |
          [ "$(date -u +%d)" = "01" ] || { echo "not the 1st, skip heartbeat"; exit 0; }
          git config user.name "uptime-heartbeat"
          git config user.email "actions@github.com"
          git checkout -B heartbeat
          date -u > HEARTBEAT
          git add HEARTBEAT
          git commit -m "heartbeat: $(date -u +%F)" || { echo "nothing to commit"; exit 0; }
          # heartbeat 分支非 master：webhook 过滤，不会触发 Render 部署
          git push -f origin heartbeat
